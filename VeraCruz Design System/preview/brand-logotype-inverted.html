<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink);}
  .card{width:700px;box-sizing:border-box;padding:40px 44px;display:flex;flex-direction:column;gap:18px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;}
  .eyebrow{color:var(--fg2-on-dark);} .meta{color:#777;}
  img{height:54px;width:auto;display:block;}
  .row{display:flex;align-items:center;gap:12px;height:90px;}
  .sym{height:64px;}
  p{color:var(--fg2-on-dark);}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="eyebrow">Inverted lockup</span>
      <span class="meta">-white.png</span>
    </div>
    <div class="row">
      <img class="sym" src="../assets/veracruz-symbol-white.png" alt="symbol">
      <img src="../assets/veracruz-logotype-white.png" alt="VeraCruz logotype white">
    </div>
    <p class="small" style="margin:0;">On ink grounds, flip to the white colorway. Symbol may pair with the wordmark or stand alone.</p>
  </div>
</body>
</html>
