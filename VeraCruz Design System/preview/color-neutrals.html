<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:16px;}
  .scale{display:flex;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);}
  .c{flex:1;height:90px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
  .c span{font-family:var(--font-mono);font-size:0.6rem;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Neutral scale · cool grey</span>
    <div class="scale">
      <div class="c" style="background:var(--n-950)"><span style="color:#fff">950</span></div>
      <div class="c" style="background:var(--n-800)"><span style="color:#fff">800</span></div>
      <div class="c" style="background:var(--n-600)"><span style="color:#fff">600</span></div>
      <div class="c" style="background:var(--n-500)"><span style="color:#fff">500</span></div>
      <div class="c" style="background:var(--n-400)"><span style="color:#fff">400</span></div>
      <div class="c" style="background:var(--n-300)"><span style="color:#222">300</span></div>
      <div class="c" style="background:var(--n-200)"><span style="color:#222">200</span></div>
      <div class="c" style="background:var(--n-100)"><span style="color:#222">100</span></div>
      <div class="c" style="background:var(--n-050)"><span style="color:#222">050</span></div>
    </div>
  </div>
</body>
</html>
