<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:14px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;}
  .big{font-family:var(--font-display);font-weight:300;font-size:5.2rem;line-height:0.9;letter-spacing:-0.03em;color:var(--ink);margin:0;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="eyebrow">Display · Outfit Light</span>
      <span class="meta">300 · −0.03em</span>
    </div>
    <p class="big">Draw the<br>future<span class="accent">.</span></p>
  </div>
</body>
</html>
