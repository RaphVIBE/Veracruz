<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:40px 44px;display:flex;flex-direction:column;gap:18px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;}
  img{height:54px;width:auto;display:block;}
  .row{display:flex;align-items:center;gap:18px;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="eyebrow">Primary wordmark</span>
      <span class="meta">veracruz-logotype.png</span>
    </div>
    <div class="row" style="height:90px;">
      <img src="../assets/veracruz-logotype.png" alt="VeraCruz logotype">
    </div>
    <p class="small" style="margin:0;">Horizontal lockup, ink on paper. Clear space ≥ the cap-height of the wordmark on all sides. Never recolor, stretch, or add effects.</p>
  </div>
</body>
</html>
