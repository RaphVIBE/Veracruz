<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .badge{font-family:var(--font-mono);font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);}
  .b-out{border:1px solid var(--line-strong);color:var(--fg2);}
  .b-ink{background:var(--ink);color:#fff;}
  .b-cherry{background:var(--cherry-tint);color:var(--cherry-press);}
  .idx{display:flex;align-items:center;gap:10px;}
  .num{font-family:var(--font-mono);font-size:1.6rem;color:var(--ink);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cherry);}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Badges &amp; index markers</span>
    <div class="row">
      <span class="badge b-out">Speculative</span>
      <span class="badge b-ink">Featured</span>
      <span class="badge b-cherry">New</span>
    </div>
    <div class="row">
      <div class="idx"><span class="num">01</span><span class="dot"></span><span class="label">Studio</span></div>
      <div class="idx" style="margin-left:24px"><span class="num">02</span><span class="label">Work</span></div>
    </div>
  </div>
</body>
</html>
