<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--n-050);}
  .card{width:700px;box-sizing:border-box;padding:44px;display:flex;gap:28px;justify-content:center;}
  .e{flex:1;height:110px;background:var(--paper);border-radius:var(--r-md);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;}
  .cap{font-family:var(--font-mono);font-size:0.64rem;color:var(--fg3);letter-spacing:0.04em;}
  .sm{box-shadow:var(--shadow-sm);}
  .md{box-shadow:var(--shadow-md);}
  .lg{box-shadow:var(--shadow-lg);}
</style>
</head>
<body>
  <div class="card">
    <div class="e sm"><span class="cap">shadow-sm</span></div>
    <div class="e md"><span class="cap">shadow-md</span></div>
    <div class="e lg"><span class="cap">shadow-lg</span></div>
  </div>
</body>
</html>
