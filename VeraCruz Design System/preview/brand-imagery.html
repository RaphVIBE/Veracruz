<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:0;position:relative;overflow:hidden;}
  .img{width:100%;height:300px;object-fit:cover;display:block;filter:grayscale(1);}
  .cap{position:absolute;left:0;bottom:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:baseline;
       background:linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0));}
  .cap .eyebrow{color:var(--ink);}
</style>
</head>
<body>
  <div class="card">
    <img class="img" src="../assets/city-sketch.png" alt="futuristic city sketch">
    <div class="cap">
      <span class="eyebrow">Imagery · hand-drawn graphite</span>
      <span class="meta">never colorize</span>
    </div>
  </div>
</body>
</html>
