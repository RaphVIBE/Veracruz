<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;gap:14px;}
  .bar{height:14px;background:var(--ink);border-radius:var(--r-xs);}
  .cap{font-family:var(--font-mono);font-size:0.66rem;color:var(--fg3);width:78px;flex:none;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Spacing scale · 4px base</span>
    <div class="row"><span class="cap">sp-1 · 4</span><div class="bar" style="width:4px"></div></div>
    <div class="row"><span class="cap">sp-2 · 8</span><div class="bar" style="width:8px"></div></div>
    <div class="row"><span class="cap">sp-3 · 12</span><div class="bar" style="width:12px"></div></div>
    <div class="row"><span class="cap">sp-4 · 16</span><div class="bar" style="width:16px"></div></div>
    <div class="row"><span class="cap">sp-5 · 24</span><div class="bar" style="width:24px"></div></div>
    <div class="row"><span class="cap">sp-6 · 32</span><div class="bar" style="width:32px"></div></div>
    <div class="row"><span class="cap">sp-7 · 48</span><div class="bar" style="width:48px"></div></div>
    <div class="row"><span class="cap">sp-8 · 64</span><div class="bar" style="width:64px"></div></div>
    <div class="row"><span class="cap">sp-9 · 96</span><div class="bar" style="width:96px"></div></div>
    <div class="row"><span class="cap">sp-10 ·128</span><div class="bar" style="width:128px"></div></div>
  </div>
</body>
</html>
