<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;gap:22px;}
  .r{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:84px;height:64px;background:var(--n-100);border:1px solid var(--line-strong);}
  .cap{font-family:var(--font-mono);font-size:0.64rem;color:var(--fg3);letter-spacing:0.04em;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Corner radii · architectural</span>
    <div class="row">
      <div class="r"><div class="box" style="border-radius:var(--r-xs)"></div><span class="cap">xs · 2</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r-sm)"></div><span class="cap">sm · 4</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r-md)"></div><span class="cap">md · 6</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r-lg)"></div><span class="cap">lg · 10</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r-pill)"></div><span class="cap">pill</span></div>
    </div>
  </div>
</body>
</html>
