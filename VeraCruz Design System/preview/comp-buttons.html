<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:20px;}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:var(--font-display);font-weight:500;font-size:0.95rem;letter-spacing:-0.01em;
       padding:12px 26px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;}
  .ink{background:var(--ink);color:#fff;}
  .cherry{background:var(--cherry);color:#fff;}
  .ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .link{background:none;border:none;color:var(--ink);font-family:var(--font-display);font-weight:500;cursor:pointer;
        padding:0;border-bottom:1.5px solid var(--cherry);}
  .arrow .ar{color:var(--cherry);}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Buttons</span>
    <div class="row">
      <button class="btn ink">Start a project</button>
      <button class="btn cherry">Start a project</button>
      <button class="btn ghost">See the work</button>
    </div>
    <div class="row">
      <button class="link">Text link</button>
      <button class="link arrow" style="border:none">Read more <span class="ar">→</span></button>
    </div>
  </div>
</body>
</html>
