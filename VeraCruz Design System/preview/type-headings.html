<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--paper);}
  .card{width:700px;box-sizing:border-box;padding:36px 44px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px;}
  .row:last-child{border-bottom:none;}
  .tag{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.1em;color:var(--fg3);width:64px;flex:none;text-transform:uppercase;}
  h1,h2,h3{margin:0;}
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Heading scale</span>
    <div class="row"><span class="tag">H1 / 400</span><h1>The studio</h1></div>
    <div class="row"><span class="tag">H2 / 400</span><h2>Selected work</h2></div>
    <div class="row"><span class="tag">H3 / 500</span><h3>Project 014 — Speculative</h3></div>
  </div>
</body>
</html>
